on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
      - name: Install dependencies
        run: flutter pub get
      - name : analyze code
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build apk
        run: flutter build apk
